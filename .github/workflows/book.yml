name: book

on:
  pull_request:
    paths:
      - "book/**"
      - "scripts/validate_book.py"
      - "scripts/generate_book_nav.py"
      - ".github/workflows/book.yml"
  push:
    branches: [main]
    paths:
      - "book/**"
      - "scripts/validate_book.py"
      - "scripts/generate_book_nav.py"
      - ".github/workflows/book.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deterministic navigation projections
        run: python scripts/generate_book_nav.py --check
      - name: Validate pattern graph
        run: python scripts/validate_book.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.5.3
      - name: Build mdBook
        run: mdbook build book
      - name: Upload compiled mdBook
        uses: actions/upload-artifact@v4
        with:
          name: ai-gym-pattern-language-html
          path: book/book
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: book/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy mdBook to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
